
<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>考试系统加载中</title>
</head>
<body>
<div style="font-family:sans-serif;text-align:center;padding:40px">考试系统加载中，请稍候…</div>
<script>
var API = 'https://exam-platform-wcjblhawyf.cn-hangzhou.fcapp.run';
var page = location.hash === '#admin' ? '/admin' : '/';
fetch(API + page)
  .then(function (r) { return r.text(); })
  .then(function (html) {
    html = html.replace('<head>', '<head><base href="' + API + '">');
    document.open();
    document.write(html);
    document.close();
  })
  .catch(function (e) {
    document.body.innerHTML = '<div style="padding:40px;text-align:center">加载失败：' + e.message + '</div>';
  });
</script>
</body>
</html>
